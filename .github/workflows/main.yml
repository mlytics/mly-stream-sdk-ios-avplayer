name: iOS Simulator Build

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * MON'    

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest

    strategy:
      matrix:
        project_dir:
          - Examples/Swift-Player
        scheme:
          - Swift-Player
        os: [latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install CocoaPods dependencies
        run: |
          sudo gem install cocoapods
          pod install --project-directory=${{ matrix.project_dir }}

      - name: Build for iOS Simulator
        run: |
          xcodebuild -workspace "${{ matrix.project_dir }}/${{ matrix.scheme }}.xcworkspace" \
                     -scheme "${{ matrix.scheme }}" \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator' \
                     clean build
